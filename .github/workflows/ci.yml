name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same pgvector-enabled image as docker-compose so CI and local agree.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: podmonitor
          POSTGRES_PASSWORD: podmonitor
          POSTGRES_DB: podmonitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U podmonitor -d podmonitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://podmonitor:podmonitor@localhost:5432/podmonitor
      TEST_DATABASE_URL: postgres://podmonitor:podmonitor@localhost:5432/podmonitor_test
      # Tests only need bcrypt to be correct, not slow.
      BCRYPT_COST: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  sidecar:
    name: Sidecar contract tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sidecar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements-dev.txt

      # requirements-dev.txt deliberately omits faster-whisper: the contract tests inject
      # a fake transcriber, so CI needs no model weights.
      - run: pip install -r requirements-dev.txt

      - name: Contract tests
        run: pytest -q
